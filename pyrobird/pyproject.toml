[build-system]
requires = [
  "setuptools",
  "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "pyrobird"
dynamic = ["version"]
description = "pyrobird is a python backend for Firebird HENP event display"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
  { name = "Dmitry Romanov", email = "romanovda@gmail.com" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]
dependencies = [
  "click",
  "rich",
  "pyyaml",
  "flask",
  "flask-cors",
  "flask-compress>=1.8.0",
  "json5",
  "uproot"
]

[project.optional-dependencies]
batch = ["playwright"]
xrootd = ["fsspec-xrootd", "xrootd"]
# jsonschema exercises dex-schema/*.schema.json in tests (CI installs .[test])
test = ["pytest", "jsonschema"]
dev = ["build", "twine", "coverage", "pytest", "jsonschema"]

[project.scripts]
fbd = "pyrobird.cli:cli_app"
pyrobird = "pyrobird.cli:cli_app"

# --- Setuptools configuration ---
# Package data is declared explicitly below. MANIFEST.in still decides what the
# sdist holds, and `uv build` builds the wheel from the sdist, so a file that
# MANIFEST.in excludes never reaches the wheel: keep the two in sync and check
# a build with `python scripts/check_dist.py dist/`.
# The server/static directory contains the Angular frontend build output
# and is included as data files, not as Python packages.

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pyrobird*"]
exclude = ["pyrobird.server.static*"]

[tool.setuptools.package-data]
pyrobird = [
    "data/*.yaml",
    "server/templates/**/*",
    "server/static/**/*",
]

[tool.setuptools.dynamic]
version = { attr = "pyrobird.__version__" }
