name: Backend Pyrobird Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    defaults:
      run:
        working-directory: ./pyrobird

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        # --locked fails when pyrobird/uv.lock disagrees with pyproject.toml.
        # The `test` extra holds pytest and jsonschema (the DEX schema tests).
        run: uv sync --locked --extra test --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --no-sync python -m pytest ./tests/unit_tests
